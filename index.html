
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BokCoin</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0877d1;
  color: white;
  text-align: center;
}

h1 {
  margin-top: 45px;
  font-size: 34px;
}

#coins {
  font-size: 30px;
  margin: 20px;
}

.coin {
  width: 220px;
  height: 220px;
  margin: 30px auto;
  border-radius: 50%;
  background: gold;
  border: 8px solid #d99b00;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 80px;
  font-weight: bold;
  color: #0877d1;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
  cursor: pointer;
  user-select: none;
  transition: transform .08s;
}

.coin:active {
  transform: scale(.92);
}

p {
  font-size: 18px;
}
</style>
</head>

<body>

<h1>BokCoin</h1>

<div id="coins">0</div>

<div class="coin" onclick="tap()">B</div>

<p>Tap the coin</p>

<script>
let coins = 0;

function tap() {
  coins++;
  document.getElementById("coins").innerText = coins;
}
</script>

</body>
</html>
